name: Build external downloads add-on
on:
  push:
    branches: [external-downloads]
    paths:
      - 'ExternalDownloads/**'
      - '.github/workflows/external-downloads.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Check hook lifecycle regressions
        run: python3 ExternalDownloads/test_runtime_helpers.py
      - name: Build iPhone add-on
        run: |
          mkdir -p build
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.1 \
            -fobjc-arc -fblocks -O2 -Wall -Wextra -Werror=implicit-function-declaration \
            -Wno-unused-parameter -Wno-deprecated-declarations \
            -dynamiclib ExternalDownloads/ExternalDownloads.m \
            -framework Foundation -framework UIKit -framework AVKit -framework AVFoundation \
            -install_name @rpath/ExternalDownloads.dylib \
            -o build/ExternalDownloads.dylib
          codesign --force --sign - build/ExternalDownloads.dylib
          shasum -a 256 build/ExternalDownloads.dylib > build/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ExternalDownloads
          path: build/
          if-no-files-found: error

